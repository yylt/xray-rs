[package]
name = "xray-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = { version = "0.3.32", default-features = false, features = ["std"] }
bytes = { version = "1.10.1", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.227", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9.34", default-features = false }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
mimalloc = { version = "0.1.48", default-features = false, optional = true }
parking_lot = { version = "0.12.5", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
fst = { version = "0.4.7", default-features = false }
# runtime
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"] }
hickory-resolver = { version = "0.26.0", default-features = false, features = ["system-config"] }
aws-lc-rs = { version = "*", optional = true, default-features = false }
tokio = { version = "1.49.0", default-features = false, features = ["io-std", "net", "signal", "sync", "time", "fs", "rt-multi-thread", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
async-stream = "0.3.6"
ahash = { version = "0.8.12", default-features = false, features = ["std", "runtime-rng"] }
rustls = { version = "0.23.37", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = { version = "0.8.3", default-features = false }
rustls-pemfile = { version = "2.2.0", default-features = false, features = ["std"] }
x509-parser = { version = "0.18.1", default-features = false }
tun = { version = "0.8.6", default-features = false, features = ["async"], optional = true }
etherparse = { version = "0.19.0", default-features = false, features = ["std"] }
pprof = { version = "0.14", default-features = false, optional = true, features = ["prost-codec", "flamegraph"] }
socket2 = { version = "0.6", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "http2", "server-auto", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", default-features = false }
http = { version = "1.4", default-features = false }
hyper = { version = "1.8", default-features = false, features = ["server", "http1"] }
tonic = { version = "0.14.2", default-features = false, features = ["gzip", "channel", "server", "codegen"] }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = { version = "0.4", default-features = false }
ring = { version = "0.17.14", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
httparse = { version = "1.10.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }
hickory-proto = { version = "0.25", default-features = false }
lru = { version = "0.16", default-features = false }
ipnet = { version = "2.12", default-features = false }
url = { version = "2.5", default-features = false }
time = { version = "0.3", default-features = false, features = ["formatting", "local-offset", "std"] }
pin-project-lite = { version = "0.2.17", default-features = false }

[[bin]]
name = "rsdns"
path = "src/bin/rsdns/main.rs"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = true
debug-assertions = false
codegen-units = 1

[profile.release-with-symbols]
inherits = "release"
strip = false

[features]
default = ["aws-lc-rs", "mimalloc", "tun"]
tun = ["dep:tun"]
mimalloc = ["dep:mimalloc"]
profiling = ["dep:pprof"]
aws-lc-rs = [
  "dep:aws-lc-rs",
  "tokio-rustls/aws-lc-rs",
  "rcgen/aws_lc_rs",
  "hickory-resolver/tls-aws-lc-rs",
  "hickory-resolver/https-aws-lc-rs",
]
ring = ["tokio-rustls/ring", "rcgen/ring", "hickory-resolver/tls-ring", "hickory-resolver/https-ring"]
