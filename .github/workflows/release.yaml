name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BIN_NAME: "xray-rs"
  # Pin jemalloc to a 4 KiB page size (LG_PAGE=12) on every target so the
  # allocator layout is identical across architectures.
  JEMALLOC_SYS_WITH_LG_PAGE: "12"
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTUP_HOME: ${{ github.workspace }}/.rustup

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    # Debian 12 (bookworm) build environment: every binary links glibc 2.36 and
    # therefore stays runnable on Debian 12 and newer.
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - name: Linux aarch64
            target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cargo
            ${{ github.workspace }}/.rustup
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform.target }}-cargo-

      - name: Install build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            cmake perl
          if [ "${{ matrix.platform.arch }}" = "arm64" ]; then
            # gcc-aarch64-linux-gnu only Recommends the target sysroot, so
            # libc6-dev-arm64-cross must be installed explicitly; without it the
            # cross gcc cannot find <sys/types.h> (and other libc headers), which
            # breaks building C deps like aws-lc-sys.
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          . "$CARGO_HOME/env"
          rustup target add ${{ matrix.platform.target }}

      - name: Configure aarch64 cross linker (gnu)
        if: matrix.platform.arch == 'arm64'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_AARCH64_UNKNOWN_LINUX_GNU=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary (gnu, 4K page)
        run: |
          . "$CARGO_HOME/env"
          cargo build --release --bin ${{ env.BIN_NAME }} --target ${{ matrix.platform.target }}

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/${{ env.BIN_NAME }} dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          tar -C dist -czf dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}.tar.gz ${{ env.BIN_NAME }}-${{ matrix.platform.target }}

      - name: Store xray-rs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}.tar.gz
          retention-days: 1

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            artifacts/**/${{ env.BIN_NAME }}-*.tar.gz
