name: E2E

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-xray:
    name: E2E xray-rs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Checkout Xray-Core v26.10.21
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: 1b1647cd9ddf0abc34b981d4611fc03bcac1ca74
          path: .xray-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ".xray-core/go.mod"
          cache-dependency-path: ".xray-core/go.sum"

      - name: Install Caddy v2.11.9 for XHTTP reverse proxy tests
        env:
          CADDY_VERSION: 2.11.9
        run: |
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          checksums="caddy_${CADDY_VERSION}_checksums.txt"
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 -O "$base/$archive"
          curl --fail --silent --show-error --location --retry 3 -O "$base/$checksums"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' "$checksums" > caddy.sha512
          sha512sum --check caddy.sha512
          tar -xzf "$archive" caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy
          caddy version

      - name: Build Xray-Core
        working-directory: .xray-core
        run: go build -o xray ./main

      - name: Run native and bidirectional compatibility E2E tests
        run: make e2e-compat XRAY_CORE_BIN="$GITHUB_WORKSPACE/.xray-core/xray"
