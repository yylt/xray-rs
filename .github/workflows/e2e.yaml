name: E2E

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-xray:
    name: E2E xray-rs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "tests/e2e/go.mod"

      - name: Build xray-rs
        run: cargo build

      - name: Run xray-rs E2E tests
        run: ./tests/e2e/run_xray_tests.sh
