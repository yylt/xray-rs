name: E2E

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-xray:
    name: E2E xray-rs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Checkout Xray-Core v26.10.21
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: 1b1647cd9ddf0abc34b981d4611fc03bcac1ca74
          path: .xray-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ".xray-core/go.mod"
          cache-dependency-path: ".xray-core/go.sum"

      - name: Build Xray-Core
        working-directory: .xray-core
        run: go build -o xray ./main

      - name: Run native and bidirectional compatibility E2E tests
        run: make e2e-compat XRAY_CORE_BIN="$GITHUB_WORKSPACE/.xray-core/xray"
