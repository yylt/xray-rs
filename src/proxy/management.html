<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>xray-rs management</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color-scheme:light dark;--bg:#f3f6f5;--panel:#fff;--ink:#172b28;--muted:#526763;--line:#cbd8d5;--accent:#087e72;--danger:#a42e25} @media(prefers-color-scheme:dark){:root{--bg:#111b1a;--panel:#1b2927;--ink:#e4efec;--muted:#a5b9b4;--line:#41534f;--accent:#64c7b7;--danger:#ff9a8f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1180px;margin:auto;padding:22px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.45rem;margin:0}h2{font-size:1.08rem;margin:0 0 12px}section{border-top:1px solid var(--line);padding:18px 0}input,textarea,button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}textarea{width:100%;min-height:360px;font:13px/1.5 ui-monospace,monospace;resize:vertical}input{min-width:240px}label{display:flex;align-items:center;gap:8px}.muted{color:var(--muted)}.error{color:var(--danger);white-space:pre-wrap}#login{max-width:440px;margin:12vh auto}#app[hidden],#login[hidden]{display:none}.metrics{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px}.metric{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel)}@media(max-width:650px){main{padding:14px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<section id="login" hidden><h1>Sign in</h1><p class="muted">Management API token</p><form id="loginForm"><label><input id="token" type="password" autocomplete="current-password" required><button class="primary">Continue</button></label></form><p id="loginError" class="error"></p></section>
<div id="app" hidden><header><h1>xray-rs</h1><div class="row"><span id="restartState" class="muted"></span><button id="refresh" title="Refresh status and statistics">Refresh</button><button id="logout" title="Clear session token">Sign out</button></div></header>
<section><h2>Traffic</h2><div class="metrics"><div class="metric">Uplink <strong id="up">0</strong></div><div class="metric">Downlink <strong id="down">0</strong></div><div class="metric">Runtime <strong id="runtime">Running</strong></div></div><p id="error" class="error"></p></section>
<section><div class="row"><h2>Configuration</h2><span id="version" class="muted"></span></div><p class="muted">Advanced JSON editor; existing inbound, outbound and routing objects remain intact.</p><label>Default outbound tag <input id="defaultTag"></label><textarea id="config" spellcheck="false" aria-label="Advanced JSON configuration"></textarea><div class="row"><button class="primary" id="save">Validate and save</button><button id="reload">Discard local edits</button><button id="restart">Restart service</button><button id="rotate">Rotate token</button></div><p id="message" class="muted"></p></section></div>
</main><script>
const $=id=>document.getElementById(id);let version='',data=null,token=sessionStorage.getItem('xray-token')||'';const api=async(path,options={})=>{const headers=new Headers(options.headers||{});if(token)headers.set('Authorization','Bearer '+token);if(options.body)headers.set('Content-Type','application/json');const r=await fetch('/api/v1'+path,{...options,headers});if(r.status===401)throw Error('Unauthorized');const t=await r.text();let v={};try{v=JSON.parse(t)}catch{}if(!r.ok)throw Error(v.error||r.statusText);return v};function encode(v){return JSON.stringify(v,null,2)}function syncFields(){if(!data)return;$('defaultTag').value=data.routing?.defaultTag||data.outbounds?.[0]?.tag||''}
async function refresh(){const c=await api('/config');version=c.version;data=c.config;$('version').textContent='Version '+version+(c.token_set?' · token set':' · authentication disabled');$('config').value=encode(data);syncFields();const s=await api('/stats');$('up').textContent=s.uplink??0;$('down').textContent=s.downlink??0;$('runtime').textContent='Running';$('restartState').textContent=''}async function load(){try{await refresh();$('login').hidden=true;$('app').hidden=false}catch(e){if(e.message==='Unauthorized'){$('app').hidden=true;$('login').hidden=false}else $('error').textContent=e.message}}
$('loginForm').onsubmit=async e=>{e.preventDefault();token=$('token').value;try{await load();if(!$('app').hidden)sessionStorage.setItem('xray-token',token)}catch(err){$('loginError').textContent=err.message}};$('logout').onclick=()=>{sessionStorage.removeItem('xray-token');token='';load()};$('refresh').onclick=()=>load();$('reload').onclick=()=>load();$('config').oninput=()=>{try{data=JSON.parse($('config').value);syncFields()}catch{}};$('defaultTag').onchange=()=>{data.routing=data.routing||{};data.routing.defaultTag=$('defaultTag').value;$('config').value=encode(data)};$('save').onclick=async()=>{try{const parsed=$('config').value.trim().startsWith('{')?JSON.parse($('config').value):parseYaml($('config').value);const r=await api('/config',{method:'PUT',body:JSON.stringify({expected_version:version,config:parsed})});version=r.version;$('restartState').textContent=r.restart_required?'Pending restart':'Applied';$('message').textContent=r.restart_required?'Saved. Restart required for inbound/outbound changes.':'Saved and applied.';await refresh()}catch(e){$('message').textContent=e.message}};$('restart').onclick=async()=>{if(confirm('Restart xray-rs now? Existing connections will be interrupted.'))try{await api('/restart',{method:'POST',body:'{}'});$('message').textContent='Restart accepted.'}catch(e){$('message').textContent=e.message}};$('rotate').onclick=async()=>{const next=prompt('New management token (blank disables authentication):');if(next===null)return;try{await api('/token',{method:'POST',body:JSON.stringify({token:next||null})});token=next;sessionStorage.setItem('xray-token',token);$('message').textContent='Token updated. The previous token is invalid.';await load()}catch(e){$('message').textContent=e.message}};
// A tiny YAML reader for plain JSON-compatible mappings/sequences; unknown YAML syntax should use JSON.
function parseYaml(text){const lines=text.split(/\r?\n/).filter(x=>x.trim()&&!x.trim().startsWith('#'));let i=0;function block(indent){let arr=lines[i]?.trimStart().startsWith('- '),out=arr?[]:{};while(i<lines.length){let raw=lines[i],n=raw.length-raw.trimStart().length;if(n<indent)break;if(n>indent)throw Error('Invalid indentation');let s=raw.trim();i++;if(arr){if(!s.startsWith('- '))throw Error('Mixed sequence and mapping');let v=s.slice(2);out.push(v?value(v):block(indent+2))}else{let p=s.indexOf(':');if(p<1)throw Error('Expected key: value');let k=s.slice(0,p),v=s.slice(p+1).trim();out[k]=v?value(v):i<lines.length&&lines[i].length-lines[i].trimStart().length>indent?block(indent+2):null}}return out}function value(s){if(s==='[]')return[];if(s==='{}')return{};if(s==='null'||s==='~')return null;if(s==='true')return true;if(s==='false')return false;if(/^-?\d+(\.\d+)?$/.test(s))return Number(s);try{return JSON.parse(s)}catch{return s}}return block(0)}load();
</script></body></html>
