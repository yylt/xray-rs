inbounds:
  - listen: 127.0.0.1
    port: 2080
    protocol: http
    tag: http-in
    settings:
      allowTransparent: false

outbounds:
  - tag: proxy
    protocol: trojan
    settings:
      address: 127.0.0.1
      port: 10443
      password: test-password-123
    streamSettings:
      network: xhttp
      security: none
      xhttpSettings:
        path: /test
        # POST body limit in bytes; must not exceed the server or CDN limit.
        maxEachPostBytes: 131072
        # Minimum interval between POST starts in milliseconds; 0 disables waiting.
        minPostsIntervalMs: 5
        # Use maxEachPostBytes: 65536 when connecting to an older server.
        # mode defaults to packet-up, the only supported mode.
        # http2InitialWindowSize: 4194304  # HTTP/2 stream window, 4 MiB by default.
        upload:
          address: 127.0.0.1
          port: 20080
        download:
          address: 127.0.0.1
          port: 20080
