# xray-rs 全量配置参考（以当前源码支持的字段为准，不等同于 Xray-core 配置）。
# 用法：复制后按部署场景删减；示例密码、UUID、域名和证书路径必须替换。
# 未注释部分是一个 YAML 配置；注释中的 reverse / tun 等为按需启用的替代片段。
# 默认值指“省略字段”时的行为；null 仅适用于可选字段，并不代表所有字段都能省略。
# 顶层仅支持 log、inbounds、outbounds、routing，均可省略；未知顶层字段会报错。
# DNS 使用系统解析器，没有 dns 配置块；统计随代理自动初始化，没有 stats 配置块。
# 线程模型不是 YAML 配置：使用命令行 run --thread single|multi（默认 single）。
# 相对文件路径基于进程工作目录，而非本配置文件目录。

# ── 日志 ──────────────────────────────────────────────────────────────
log:
  # 最低输出级别：off / error / warn / info / debug / trace；默认 info。
  level: info
  # 日志文件；默认 null，输出到 stderr。指定文件时追加写入，父目录须存在。
  # Unix 下 SIGHUP 只重开日志文件以配合 logrotate，不会重载代理配置。
  file: null
  # file: /var/log/xray-rs/xray-rs.log

# ── 入站 ──────────────────────────────────────────────────────────────
# 支持 http / socks / trojan / vless / api / reverse / tun（需 tun feature）。
# 每项公共字段：
#   listen：必填，通常为本机 IPv4 / IPv6 地址。
#   port：可选 u16；TCP 监听必须提供。Unix socket 监听时省略或设 null。
#   tag：可选，默认 "in"；建议显式配置且唯一，用于路由和统计。
#   protocol：选择一种协议，settings 的结构随之变化，不可混用其他协议的字段。
#   streamSettings：可选，默认 network=tcp、security=none；传输字段见出站示例。
# Unix socket（仅支持的平台/传输）：listen: /run/xray-rs/proxy.sock,0660
#   port: null；路径后可附八进制权限，省略权限默认 0666。
# api 直接监听 TCP HTTP，不使用 streamSettings；tun 也不使用常规传输。
inbounds:
  - tag: http-in
    listen: 127.0.0.1
    port: 8080
    protocol: http
    # CONNECT 在出站连接成功后才回复 200，不等待隧道内客户端 TLS 握手。
    # 建立连接失败返回 502，明确超时返回 504；200 之后的错误只关闭隧道。
    # HTTP / SOCKS / API 的 settings 可整块省略，使用各自默认设置。
    settings:
      # HTTP Basic 代理认证；默认 null（不认证），配置时 user / pass 均必填。
      account:
        user: example-user
        pass: change-me-http-password
      # 可反序列化，默认 false；当前实现未使用此开关，不会启用透明代理。
      allowTransparent: false
    streamSettings:
      network: tcp
      security: none

  - tag: socks-in
    listen: 127.0.0.1
    port: 1080
    protocol: socks
    settings:
      # SOCKS5 用户名密码认证；默认 null（不认证）。
      account:
        user: example-user
        pass: change-me-socks-password
      # 是否支持 SOCKS5 UDP ASSOCIATE；默认 false。
      udp: false
      # 可选字符串，当前实现未使用，不会改变 UDP 绑定/通告地址。
      ip: null

  - tag: trojan-in
    listen: 127.0.0.1
    port: 8443
    protocol: trojan
    settings:
      # 必填，单个明文密码；客户端必须一致。Trojan 应配合 TLS 使用。
      password: change-me-trojan-password
    streamSettings:
      network: ws
      security: tls
      wsSettings:
        # 默认 /ws；两端须匹配。WebSocket 仅有 path 配置，没有 headers 字段。
        path: /ws
      tlsSettings:
        # 服务端证书列表；省略或 [] 时生成自签名证书，仅适合测试。
        # 生产环境取消下列注释，使用实际证书链和私钥（PEM）。
        # certificates:
        #   - certFile: /etc/xray-rs/fullchain.pem
        #     keyFile: /etc/xray-rs/private.key
        certificates: []
        alpn: [http/1.1]

  - tag: vless-in
    listen: 127.0.0.1
    port: 10001
    protocol: vless
    settings:
      # 必填，有效 UUID；单个用户，客户端必须一致。当前 VLESS 路径仅支持 TCP。
      # VLESS 本身不加密；公网应启用 TLS（本例明文仅监听回环地址）。
      id: 01234567-89ab-4cde-8fab-0123456789ab

  - tag: api-in
    listen: 127.0.0.1
    port: 9090
    protocol: api
    settings:
      # API settings 拒绝未知字段。
      # 指标历史保留时长，默认 24h；支持正整数加 s / m / h / d，范围 1s..3d。
      retention: 24h
      # Bearer token；默认 null / 空串时不认证。涉及管理能力，务必限制访问。
      # 多个 API 入站共享管理状态；启动 token 取第一个 API 入站的设置。
      token: change-me-api-token

  # reverse 入站：隧道服务端，独立守护任务，不是常规业务入站。
  # - tag: reverse-in
  #   listen: 0.0.0.0
  #   port: 10002
  #   protocol: reverse
  #   settings:
  #     password: change-me-reverse-password  # 必填，两端一致。
  #     heartbeat: 30  # 可选，心跳发送间隔（秒），默认 30，必须大于 0。
  #   streamSettings:
  #     network: tcp
  #     security: tls
  #     tlsSettings:
  #       certificates:
  #         - certFile: /etc/xray-rs/fullchain.pem
  #           keyFile: /etc/xray-rs/private.key

  # tun 入站：需编译启用 tun feature（默认启用），并具有创建 TUN 设备的权限。
  # listen 为公共结构必填字段；port 可省略，不用于实际监听。
  # - tag: tun-in
  #   listen: 127.0.0.1
  #   port: null
  #   protocol: tun
  #   settings:
  #     name: tun0             # 必填，设备名；不是可省略的 serde 默认值。
  #     mtu: 1500              # 可选，默认 1500，单位字节。
  #     cidrs: [10.0.0.1/24]    # 必填，设备 CIDR 列表。
  #     auto_route: false      # 可选，当前实现未使用；系统路由需要自行配置。

# ── 出站与传输 ────────────────────────────────────────────────────────
# 支持 freedom / blackhole / socks / trojan / vless / reverse；没有 http 出站。
# 第一项的 tag 是未命中路由时的默认出站；不要把 reverse 守护出站作为默认路由。
# tag 省略时：freedom（或无协议）为 freedom，blackhole 为 black，其他为 proxy-N。
# streamSettings 同样可用于常规入站；只填写所选 network / security 对应的配置块。
# gRPC / XHTTP 的 loadBalancer 若填写未知字符串，会静默回退 least_loaded。
# 注意：当前 TCP / WS 的 TLS 构造失败可能退为明文；必须确保 tlsSettings 及证书有效，
# 不要仅凭 security: tls 判断加密已生效。gRPC / XHTTP 会传播 TLS 构造错误。
outbounds:
  - tag: direct
    protocol: freedom
    # freedom 的 settings 可省略；出站连 protocol 也省略时同样采用直连。
    settings:
      # system（默认）/ ipv4 / ipv6；仅调整系统 DNS 结果的尝试顺序。
      # ipv4 / ipv6 表示优先，不排除另一地址族；同地址族保持系统返回顺序。
      # 域名只解析一次，重复 IP 去重；每个候选 IP 最多尝试一次。
      prefer: system
      # 每个候选地址的连接超时（毫秒），默认 5000，必须为正整数。
      # 包含传输握手；字面 IP 同样适用。不是转发空闲超时，不限制 DNS 解析。
      # 失败或超时后尝试下一个 IP；总等待可能随候选地址数量增长。
      # 连接建立后不因 TLS / 应用错误重连或重放数据。
      # UDP 仅重试本地 connect 失败；connect 成功不保证远端可达。
      connectTimeoutMs: 5000
      # 默认 false；Linux eBPF 转发加速，需内核能力及加载 BPF 的权限。
      # 非 Linux 设 true 会报错；不满足条件时不要开启。
      bpf: false
    streamSettings:
      # tcp（别名 raw）/ ws（别名 websocket）/ grpc / xhttp（别名 splithttp）。
      # 默认 tcp；每个 streamSettings 只能选择一种 network。
      network: tcp
      # none / tls，默认 none。tls 应同时提供 tlsSettings。
      security: none
      # 整块省略时默认接收 98304、发送 81920、tcpNoDelay=true。
      # 显式写 sockopt: {} 时各项均为 null，不会逐字段补齐上述默认值。
      sockopt:
        recvBufferSize: 98304  # 接收缓冲区字节数；null 表示不设置。
        sendBufferSize: 81920  # 发送缓冲区字节数；null 表示不设置。
        tcpNoDelay: true       # TCP_NODELAY；null 表示不设置。
        tcpCongestion: null    # Linux 拥塞算法，如 cubic / bbr，必须由内核支持。

  - tag: block
    protocol: blackhole
    # 丢弃连接。没有协议设置；不要写 settings: {}，应省略或为 null。

  - tag: socks-out
    protocol: socks
    settings:
      address: socks.example.com  # 必填，上游地址。
      port: 1080                  # 必填，上游端口。
      account:                    # 可选，省略 / null 表示不认证。
        user: example-user        # 配置 account 时必填。
        pass: change-me-upstream-password

  - tag: trojan-ws-out
    protocol: trojan
    settings:
      address: proxy.example.com  # 必填，上游服务器。
      port: 443                   # 必填。
      password: change-me-trojan-password  # 必填，与服务端一致。
    streamSettings:
      network: ws
      security: tls
      wsSettings:
        path: /ws  # 默认 /ws。
      tlsSettings:
        # 客户端 SNI / 证书校验名称；普通 TCP / WS 省略时使用目标 IP。
        # 使用域名证书时应显式配置；XHTTP 的端点名称规则见下文。
        serverName: proxy.example.com
        # 默认 false；true 跳过证书校验，有中间人攻击风险，不用于生产。
        allowInsecure: false
        # ALPN 列表；服务端省略默认 [h2, http/1.1]，普通客户端默认
        # [h3, h2, http/1.1]。列出 h3 不代表支持 QUIC 传输。
        # XHTTP 客户端固定使用 h2，显式 alpn 必须包含 h2；gRPC 应配置 h2。
        alpn: [http/1.1]
        # 可选，加密套件名称列表；省略使用当前 rustls provider 的默认集合。
        # 显式配置不可为空，必须是 provider 支持的准确名称，顺序即偏好。
        cipherSuites:
          - TLS13_AES_256_GCM_SHA384
          - TLS13_AES_128_GCM_SHA256
        # certificates 用于服务端证书，不是客户端自定义 CA / mTLS 设置。
        # certFile 的兼容别名为 certificateFile；keyFile 无别名。

  - tag: vless-grpc-out
    protocol: vless
    settings:
      address: grpc.example.com  # 必填；支持 Unix socket 的传输也可使用绝对路径。
      port: 443                  # 必填 u16；Unix socket 场景可填 0。
      id: 01234567-89ab-4cde-8fab-0123456789ab  # 必填，有效 UUID。
    streamSettings:
      network: grpc
      security: tls
      tlsSettings:
        serverName: grpc.example.com
        allowInsecure: false
        alpn: [h2]
      # network=grpc 时必须提供 grpcSettings；未知字段会报错。
      grpcSettings:
        serviceName: proxy  # 必填，服务名，两端须匹配。
        multiMode: false    # 默认 false；true 使用 MultiHunk 批量模式，两端匹配。
        # HTTP/2 :authority；默认：显式 authority > TLS serverName > 目标 IP
        # （Unix socket 为 localhost）。不是 TCP 连接目标。
        authority: grpc.example.com
        userAgent: null     # 可选，自定义客户端 User-Agent；省略使用传输库默认值。
        bufByteSize: 262144  # 默认 262144，传给 tonic 客户端请求队列容量，非字节读写缓冲。
        http2KeepAliveInterval: 30  # 默认 30，整数秒，不要写 "30s"。
        http2KeepAliveWhileIdle: true  # 默认 true，空闲时仍发送 HTTP/2 保活。
        http2InitialWindowSize: 2097152  # 客户端流窗口，默认 2 MiB；连接窗口为其 2 倍。
        # 默认 least_connection；round_robin=轮询，least_loaded=两选一负载评分，
        # least_connection=最少活动流。用于同一上游域名解析出的多个地址。
        loadBalancer: least_loaded

  - tag: trojan-xhttp-out
    protocol: trojan
    settings:
      address: xhttp.example.com
      port: 443
      password: change-me-xhttp-password
    streamSettings:
      network: xhttp
      security: tls
      tlsSettings:
        serverName: xhttp.example.com
        allowInsecure: false
        alpn: [h2]
      # network=xhttp 时必须提供 xhttpSettings。
      xhttpSettings:
        path: /xhttp  # 必填，路径前后斜杠会规范化；两端须匹配。
        mode: packet-up  # 默认 packet-up，目前只支持此值。
        # 单次 POST 请求体上限，单位字节，默认 128 KiB，必须大于 0。
        # 客户端用于拆包，服务端用于限额；客户端不得超过服务端及 CDN 的上限。
        # 可按 CDN 限制调大（如 1048576 = 1 MiB）；连接旧服务端时设为 65536。
        maxEachPostBytes: 131072
        # 客户端同一会话相邻 POST 开始发送的最小间隔，单位毫秒，默认 5。
        # 允许 0（不额外等待）；首包立即发送，服务端不强制此间隔。
        # 保持串行 ACK，等待期间合并就绪小包，不为攒满一包额外等待。
        minPostsIntervalMs: 5
        # 流窗口，客户端与服务端均应用；默认 4 MiB，范围 1..2147483647。
        # HTTP/2 连接窗口为流窗口的 2 倍；客户端另截断至协议上限。
        http2InitialWindowSize: 4194304
        # 可选策略，同 gRPC 的三个取值；XHTTP 默认 least_connection。
        loadBalancer: least_connection
        # 客户端上传 / 下载端点；服务端通常省略二者，使用 inbound 的 listen/port。
        # 省略 upload：使用协议上游端口，地址优先取 TLS serverName，再取协议上游地址。
        # 省略 download：复制最终 upload；显式配置端点时 port 必填。
        # 端点 address 可省略，依次取 TLS serverName、协议上游地址、upload 地址
        # （最后一项仅适用于 download）。显式空白字符串会报错。
        # 最终端点 address 同时决定拨号解析、TLS SNI/校验名和 HTTP authority；
        # 显式端点地址会覆盖 serverName 对该端点名称的影响。
        upload:
          address: xhttp.example.com
          port: 443
        download:
          address: xhttp.example.com
          port: 443

  # reverse 出站：内网客户端主动连接 reverse 服务端，独立守护任务；
  # 不注册为普通路由可选 sink，不能在 outboundTag / fallbackTags 中引用。
  # - tag: reverse-out
  #   protocol: reverse
  #   settings:
  #     address: reverse.example.com  # 必填，隧道服务器。
  #     port: 10002                   # 必填，隧道端口。
  #     remote_port: 10003            # 必填，范围 1024..65535；不支持 0 / null。
  #                                  # 服务端在 0.0.0.0 开放该 SOCKS5 端口，注意防火墙。
  #     password: change-me-reverse-password  # 必填，两端一致。
  #   streamSettings:
  #     network: tcp
  #     security: tls
  #     tlsSettings:
  #       serverName: reverse.example.com
  #       allowInsecure: false
  # reverse 两端 password 至少 8 字节；没有 mode、vhost 配置，勿照搬旧示例。

# ── 路由 ──────────────────────────────────────────────────────────────
# 整块省略：AsIs，无规则，使用第一个出站；无默认出站且未命中规则则无法转发。
# 规则不是按列表顺序执行的 AND 条件：inboundTag、domain、ip 分别建索引。
# 优先级：inboundTag > 域名/IP 策略 > 第一个出站；域名采用最长后缀，IP 采用最长前缀。
# 同条规则同时填写 inboundTag / domain / ip 会分别生效，不表示同时满足。
routing:
  # routing 存在时此字段必填（枚举自身的 Default 不代表 serde 可省略）。
  # AsIs：不为路由主动解析域名，按原始域名/IP 匹配。
  # IPIfNonMatch：域名未命中后解析 DNS，再对首个解析 IP 匹配。
  # IPOnDemand：先解析域名，但仍先匹配域名规则，再匹配首个解析 IP。
  domainStrategy: AsIs
  # 可选，默认无规则；没有任何条件的规则会被忽略，不是兜底规则。
  rules:
    - domain:  # 可选字符串列表，别名 domains。
        - example.org  # 裸域名后缀，包含自身及子域名；建议小写。
        # 不支持 geosite: / full: / regexp: / domain: 等 Xray-core 匹配语法。
        # - file:rules/domains.txt  # 从文件载入，每行一个后缀。
      outboundTag: direct  # 必填，必须引用可用的普通出站 tag。
    - ip:  # 可选字符串列表，别名 ips；支持单个 IPv4/IPv6 或 CIDR。
        - 127.0.0.0/8
        - 10.0.0.0/8
        - 192.168.0.0/16
        - ::1/128
        # - file:rules/ips.txt  # 每行一个 IP 或 CIDR。
      outboundTag: direct
    - domain: [blocked.example]
      outboundTag: block
    - inboundTag: vless-in  # 可选，单个字符串而非数组；优先于域名/IP 规则。
      outboundTag: direct
  # 可选，默认 []；普通代理出站连接失败时依次尝试，不是负载均衡。
  # 当前直连失败不会继续回落，blackhole 也不会回落；已开始转发后不重试。
  # 故障回落到 direct 可能绕过代理策略，按实际需求决定是否启用。
  fallbackTags: []
  # fallbackTags: [socks-out, direct]
# file: 规则文件忽略空行及整行 # 注释；相对路径基于工作目录，文件必须存在。
