inbounds:
  - listen: 127.0.0.1
    port: 20080
    protocol: trojan
    tag: xhttp-in
    settings:
      password: test-password-123
    streamSettings:
      network: xhttp
      security: none
      xhttpSettings:
        path: /test
        # Maximum accepted POST body in bytes; clients must stay within this and CDN limits.
        maxEachPostBytes: 131072
        # Client-side minimum POST interval in milliseconds; not enforced by the server.
        minPostsIntervalMs: 5
outbounds:
  - tag: direct
    protocol: freedom
