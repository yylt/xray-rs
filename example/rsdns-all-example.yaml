# rsdns example config — full feature set
# Usage: rsdns --config example/rsdns-all-example.yaml

# Listen addresses: plain IP:port = UDP, tcp:// prefix = TCP
bind:
  - address: "0.0.0.0:14453"          # UDP
  - address: "tcp://0.0.0.0:14453"    # TCP

# Domain groups: name → list of suffixes (supports file: prefix)
groups:
  ad:
    - "*.doubleclick.net"
    - "*.googlesyndication.com"
    - "*.googleadservices.com"
    #- "file:/etc/rsdns/ad-block.txt"
  intranet:
    - "*.corp.internal"
    - "*.lan"
  foo:
    - foo.com
    - "*.foo.org"

# Upstream pools: name → servers or detailed group config.
# Default mode is serial; mode: parallel opt-in preserves old fan-out behavior.
# bootstrap=true servers are used only for resolving domain-based upstreams.
# pool section enables connection pooling with adaptive address selection.
upstream:
  bootstrap:
    servers:
      - address: 223.5.5.5
        bootstrap: true
  default:
    mode: serial
    servers:
      - address: tls://dot.pub           # TLS — domain resolved via bootstrap, all A+AAAA IPs used
        pool:
          # DoT is the main target for pool tuning: it benefits most from
          # multiple long-lived connections and a small warm pool.
          # Suggested starting point:
          #   max_size: 8
          #   min_idle: 2
          #   health_interval: 60
          #   connect_timeout: 5
          #   dns_timeout: 5
          #   health_check_timeout: 3
          #   max_consecutive_fail: 3
          #   cool_down_secs: 30
          max_size: 8
          min_idle: 2
          prefer_family: ipv4
          connect_timeout: 3
          health_check_timeout: 3
          max_consecutive_fail: 3
          cool_down_secs: 30
      - address: https://dns.quad9.net/dns-query  # DoH — domain resolved via bootstrap
        pool:
          # DoH already multiplexes well over HTTP/2, so keep the pool small.
          # Suggested starting point:
          #   max_size: 2~4
          #   min_idle: 1
          #   health_interval: 60
          #   connect_timeout: 5
          #   dns_timeout: 5
          max_size: 4
      - address: tls://1.1.1.1           # TLS with static IP
  overseas:
    mode: parallel
    servers:
      - address: tls://8.8.8.8
      - address: https://cloudflare-dns.com/dns-query
        pool:
          # Same guidance as DoH above.
          # Small pool, stable warm connection, no need to over-scale.
          max_size: 4
      - address: h3://mozilla.cloudflare-dns.com/dns-query  # DNS-over-HTTP/3
        pool:
          # DoH3 usually needs only a tiny pool because QUIC already carries
          # concurrent streams. Keep it conservative unless you see saturation.
          # Suggested starting point:
          #   max_size: 1~4
          #   min_idle: 1
          max_size: 4
      - address: quic://dns.adguard.com  # DNS-over-QUIC (new protocol support)
        pool:
          # DoQ has the same pooling shape as DoH3: keep it small unless the
          # upstream or your traffic volume clearly needs more parallelism.
          max_size: 4

# Cache configuration
cache:
  size: 4096                       # LRU capacity
  min_ttl: 60                      # clamp TTL lower bound (seconds)
  max_ttl: 3600                    # clamp TTL upper bound (seconds)
  serve_expired: true              # serve stale cache when upstream fails
  keep_ttl: false                  # global default: clamp TTL

# Hosts: suffix-matched static IP mapping (supports file: prefix and wildcard)
hosts:
  - "127.0.0.1 localhost"
  - "::1       localhost"
  - "192.168.1.1 router.lan"
  - "0.0.0.0 *.ad-domain.com"     # wildcard: all subdomains → 0.0.0.0
  - "file:/etc/hosts"

# Rules: matched in order, first hit stops
rules:
  # Block ad group with poison (A=0.0.0.0, AAAA=::)
  - match: ad
    action:
      type: block
      response: poison

  # Block with NXDOMAIN
  - match: "*.banned.example"
    qtype: A
    action:
      type: block
      response: nxdomain

  # CNAME rewrite: resolve target via upstream and return its IP
  # upstream is required; optionally deny certain query types
  - match: foo
    qtype: ANY
    action:
      type: cname
      target: site.182682.xyz
      ttl: 600
      upstream: default
      # deny_qtypes: ["AAAA"]

  # Forward intranet to default upstream, skip cache
  - match: intranet
    action:
      type: forward
      upstream: default
      cache: false

  # Forward to overseas upstream with custom TTL
  - match: "*.google.com"
    qtype: A
    action:
      type: forward
      upstream: overseas
      ttl: 60       # rewrite response TTL to 60s

  # Forward with upstream-original TTL (keep_ttl overrides ttl)
  - match: "*.github.com"
    action:
      type: forward
      upstream: default
      keep_ttl: true

  # Default catch-all
  - match: "*"
    action:
      type: forward
      upstream: default
      keep_ttl: true
      deny_qtypes: ["HTTPS"]

# Query log (optional): per-query access log with template placeholders.
# Placeholders: {type} {name} {proto} {remote} {action} {port} {size} {duration} {rcode} {answers}
log:
  # file: /var/log/rsdns-query.log   # unset = stdout
  format: '{remote}:{port} {name} [{type}] {rcode} {action} {duration}'
  # buf_size: 16384                  # bytes; write when accumulated log reaches this size
  # flush_interval_secs: 5           # seconds; also write on this interval even if below buf_size
